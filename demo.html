<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Dyslective</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the product screens from the business plan, made clickable. Web app (navy sidebar + cards) for teacher and parent, phone for the student, presenter bar docked at the bottom. Single light look on purpose, to match the printed figures. */
:root{
  color-scheme:light;
  --navy:#034774; --navy-2:#02385c; --sky:#6faedd; --blue:#3a86c4; --soft:#e6f3ff;
  --bg:#f3f7fb; --card:#ffffff; --line:#e7eef5; --ink:#0b2a44; --mut:#7a8b9c; --ink2:#33517a;
  --red:#c2382b; --red-bg:#fde8e6; --redbar:#e0574a; --yel:#b7700f; --yel-bg:#fff3dc; --yelbar:#e9a23b; --grn:#1f8a4c; --grn-bg:#e3f6ea; --grnbar:#2fa760; --orange:#f0883e;
  --sh:0 1px 3px rgba(11,42,68,.08),0 4px 12px rgba(11,42,68,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
p,h1,h2,h3{margin:0} button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-2)}

/* ---------- web app shell (teacher + parent) ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 72px)}
.side{background:linear-gradient(180deg,#034774,#02385c);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 72px);padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0 6px 24px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--sky);display:block}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#a9d3f2;font-weight:600;font-size:14.5px;margin-bottom:4px;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.nav svg{flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.15)}
.me .dot{width:34px;height:34px;border-radius:50%;background:var(--sky);color:#03243c;font-size:13px;font-weight:800;display:grid;place-items:center}
.me b{display:block;font-size:13.5px}.me span{font-size:12px;color:#a9d3f2}
.main{min-width:0;padding:22px 28px 30px;display:flex;flex-direction:column;gap:16px;padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1120px}
.crumb{font-size:13px;color:var(--mut);font-weight:600}
.crumb button{background:none;border:0;padding:0;font-weight:600;color:var(--mut)}
.crumb button:hover{color:var(--navy)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.who{display:flex;gap:14px;align-items:center}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#6faedd,#034774);color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center}
.nm{font-size:24px;font-weight:800;letter-spacing:-.4px}
.meta{font-size:13.5px;color:var(--mut);font-weight:600;margin-top:2px}
.btn{font-size:14px;font-weight:700;color:#fff;background:var(--navy);padding:10px 16px;border-radius:10px;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.ct{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.ct span{color:var(--mut);font-weight:600;font-size:13px}
.tag{font-size:13px;font-weight:800;padding:6px 13px;border-radius:999px;white-space:nowrap}
.grn{background:var(--grn-bg);color:var(--grn)}.yel{background:var(--yel-bg);color:var(--yel)}.red{background:var(--red-bg);color:var(--red)}.blu{background:var(--soft);color:var(--navy)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kc{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kv{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kl{font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.sk{display:grid;grid-template-columns:170px minmax(60px,1fr) 44px 116px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f6;font-size:14.5px}
.sk:last-child{border:0}
.sn{font-weight:700;white-space:nowrap}.pc{font-weight:700;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.b{height:10px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.b i{display:block;height:100%;border-radius:5px;background:var(--blue)}
.b i.was{position:absolute;inset:0 auto 0 0;background:#cfdbe6}
.b i.now{position:relative}
.c{font-size:12px;font-weight:800;padding:5px 0;border-radius:999px;text-align:center}
.sk2{display:grid;grid-template-columns:150px 1fr 86px;align-items:center;gap:12px;font-size:14px;color:var(--ink2);font-weight:600;margin-top:12px}
.sk2 em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.rec{background:var(--soft);border-left:4px solid var(--navy);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5}
.rec b{color:var(--navy)}
.rec.bad{background:var(--red-bg);border-color:var(--red)}.rec.bad b{color:var(--red)}
.foot{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;font-weight:700;background:var(--soft);color:var(--navy);padding:5px 10px;border-radius:999px}
.tb{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:0 8px 10px;white-space:nowrap}
.t td{padding:11px 8px;border-top:1px solid #eef2f6;font-variant-numeric:tabular-nums}
.t tr.go{cursor:pointer}.t tr.go:hover td{background:#f6f9fc}
.t .open{text-align:right;color:var(--navy);font-weight:700;white-space:nowrap}
.sc{display:inline-block;min-width:44px;text-align:center;font-size:12.5px;font-weight:800;padding:3px 7px;border-radius:999px}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.track div{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:9px 0;border-radius:9px;background:var(--line)}
.track .done{background:#cfe3f3;color:var(--navy)}.track .now{background:var(--navy);color:#fff}.track .stall{background:var(--redbar);color:#fff}
.seg{display:inline-flex;background:#e3ebf3;border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.tutors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tutor{display:flex;flex-direction:column;gap:7px}
.tutor h3{font-size:16px;font-weight:800}
.small{font-size:13px;color:var(--mut)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--grn-bg)}100%{background:#fff}}

/* ---------- student phone ---------- */
.stu{display:flex;gap:44px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:18px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.phonebox{flex:none;position:relative}
.device{position:absolute;left:0;top:0;width:400px;height:842px;transform-origin:top left}
.frame{position:absolute;inset:0;border-radius:66px;background:linear-gradient(135deg,#d9dde3 0%,#8c939d 18%,#e9ecf0 35%,#7d848e 55%,#c9ced5 75%,#6e757f 100%);padding:4px;box-shadow:0 24px 40px -18px rgba(8,30,55,.45),0 6px 14px rgba(8,30,55,.18)}
.bezel{width:100%;height:100%;border-radius:62px;background:#050608;padding:13px;position:relative}
.hb{position:absolute;background:linear-gradient(90deg,#7a818b,#c5cad1,#7a818b);border-radius:3px}
.screen{width:100%;height:100%;border-radius:50px;background:#f3f7fb;overflow:hidden;position:relative;display:flex;flex-direction:column}
.glare{position:absolute;inset:0;border-radius:50px;background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 40%);pointer-events:none;z-index:20}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:10}
.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font-weight:600;font-size:16px;color:#0b1520;flex:none}
.sicons{display:flex;gap:6px;align-items:center}
.pw{padding:6px 20px 12px;flex:1;display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.phd{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.date{font-size:12.5px;font-weight:600;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
.h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6faedd,#034774);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(3,71,116,.3)}
.hero{margin-top:16px;border-radius:24px;padding:18px 18px 18px 20px;background:linear-gradient(145deg,#0a5a90 0%,#034774 55%,#02385c 100%);color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 10px 24px -8px rgba(3,71,116,.55);position:relative;overflow:hidden;flex:none}
.hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-80px;background:rgba(255,255,255,.07)}
.ring{flex:none;position:relative;width:86px;height:86px}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.ring small{font-size:10px;font-weight:600;color:#a9d3f2;margin-top:3px}
.hk{font-size:11px;font-weight:700;letter-spacing:1px;color:#a9d3f2}
.ht{font-size:19px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px}
.hs{font-size:12px;color:#cfe3f3}
.gobtn{margin-top:11px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#034774;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;border:0;position:relative}
.prow{display:flex;gap:10px;margin-top:12px;flex:none}
.stat{flex:1;background:#fff;border-radius:18px;padding:12px 13px;box-shadow:0 1px 2px rgba(11,42,68,.06),0 4px 12px rgba(11,42,68,.05)}
.sv{font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:5px}
.sl{font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;flex:none}
.sect b{font-size:16px;font-weight:700}
.sect button{font-size:12.5px;font-weight:600;color:var(--blue);background:none;border:0;padding:0}
.skill{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(11,42,68,.06),0 4px 12px rgba(11,42,68,.05);flex:none}
.si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.psn{font-size:14px;font-weight:600}
.pbar{height:6px;border-radius:3px;background:#e7eef5;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.pct{font-size:12px;font-weight:700;color:var(--mut);flex:none}
.read{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;box-shadow:0 1px 2px rgba(11,42,68,.06),0 4px 12px rgba(11,42,68,.05);border:0;text-align:left;width:100%;flex:none}
.thumb{width:58px;height:58px;border-radius:12px;flex:none;background:linear-gradient(135deg,#1d2b64,#5a3fa0 55%,#f8576b);display:grid;place-items:center}
.rt{font-size:14px;font-weight:700;letter-spacing:-.2px}
.rm{font-size:11.5px;color:var(--mut);margin-top:3px;font-weight:500}
.ptab{flex:none;height:84px;background:rgba(255,255,255,.92);border-top:1px solid #e3eaf1;display:flex;justify-content:space-around;padding:10px 12px 0;position:relative}
.ti{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#9aa9b8;width:62px;background:none;border:0;padding:0;height:46px}
.ti[aria-pressed="true"]{color:#034774}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#0b1520}
.q{margin-top:10px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(11,42,68,.06),0 4px 12px rgba(11,42,68,.05);flex:none}
.qp{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.4px}
.pb{height:7px;border-radius:4px;background:#e7eef5;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .25s}
.qt{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:16px;line-height:1.25}
.lis{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:#e6f3ff;color:#034774;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;border:0}
.opt{margin-top:10px;background:#fff;border:2px solid #e3eaf1;border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;flex:none}
.opt[aria-pressed="true"]{border-color:#034774;background:#eef6fd}
.rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c3d2df}.opt[aria-pressed="true"] .rad{border:6px solid #034774}
.next{margin-top:16px;background:#034774;color:#fff;font-weight:800;font-size:16px;text-align:center;padding:15px;border-radius:16px;border:0;width:100%;flex:none}
.next[disabled]{opacity:.4;cursor:not-allowed}
.pcard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(11,42,68,.06),0 4px 12px rgba(11,42,68,.05);flex:none}
.chg{font-size:11.5px;font-weight:800;color:#1f8a4c;flex:none}
.passage{font-size:15.5px;line-height:1.7;margin-top:12px}
.passage.spaced{letter-spacing:.07em;word-spacing:.16em;line-height:2.05}
.passage .ln{border-radius:6px;padding:1px 3px}
.passage.focus .ln{opacity:.22}.passage.focus .ln.on{opacity:1;background:#e6f3ff}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:#cfdbe6;border:0;position:relative;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-pressed="true"]{background:#034774}.sw[aria-pressed="true"]:after{left:21px}
.ptoast{position:absolute;left:18px;right:18px;bottom:98px;background:#0b2a44;color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;z-index:15}
.aside{flex:1;min-width:280px;max-width:440px;display:flex;flex-direction:column;gap:14px;padding-top:26px}
.aside h2{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy)}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eef2f6;font-variant-numeric:tabular-nums}
.line:first-of-type{border-top:0}

/* ---------- modal, toast, presenter bar ---------- */
.mbg{position:fixed;inset:0;background:rgba(5,20,35,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal{max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.modal h2{font-size:21px;font-weight:800;margin-top:6px}
.modal table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.modal td{padding:9px 0;border-top:1px solid #eef2f6}
.modal td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.letter{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:14px;font-size:14px;margin-top:12px;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);background:#0b2a44;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.guide{position:fixed;inset:auto 0 0 0;z-index:20;background:#0b1520;color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:72px}
.guide .views{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.guide .views a{color:#cfe3f3;text-decoration:none;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.guide .views a[aria-current="page"]{background:#fff;color:#034774}
.guide .steps{display:flex;gap:5px}
.guide .steps button{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:none;color:#cfe3f3;font-weight:700;font-size:12.5px;padding:0}
.guide .steps button[aria-pressed="true"]{background:#fff;color:#034774;border-color:#fff}
.guide .say{flex:1;min-width:220px;font-size:13.5px;line-height:1.35}
.guide .say b{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#a9d3f2}
.guide .gb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
.guide .gb:hover{background:rgba(255,255,255,.24)}
.gopen{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;background:#0b1520;color:#fff;border:0;border-radius:999px;padding:8px 13px;font-weight:700;font-size:12.5px;opacity:.55}
.gopen:hover{opacity:1}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .logo{margin:0 10px 0 0;font-size:17px}.nav{width:auto;margin:0;padding:7px 9px;font-size:13px}.nav svg,.me{display:none}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .sk{grid-template-columns:1fr 44px 116px}.sk .b{grid-column:1/-1;grid-row:2}
  .sk2{grid-template-columns:1fr 86px}.sk2 .b{grid-column:1/-1;grid-row:2}
  .guide .steps{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main id="v-teacher"></main>
<main id="v-parent" hidden></main>
<main id="v-student" hidden>
  <div class="stu">

/* ---------- shared web-app pieces ---------- */
function shell(nav,active,act,ini,name,sub,main){
  return `<div class="shell"><aside class="side"><div class="logo"><i></i>Dyslective</div>

function weekly(s){
  const w=s.min.slice(); w[w.length-1]=wk(s);
  const W=520,H=190,L=8,R=12,T=14,B=26,max=60,n=Math.max(w.length,6),x=i=>L+i*(W-L-R)/(n-1),y=v=>T+(H-T-B)*(1-v/max),last=w.length-1;
  const pts=w.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Practice minutes per week, ${w.join(", ")}">
   <g stroke="#e7eef5">${[15,35,55].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
   <polygon points="${x(0)},${H-B} ${pts} ${x(last)},${H-B}" fill="rgba(58,134,196,.15)"/><polyline points="${pts}" fill="none" stroke="#3a86c4" stroke-width="3.5" stroke-linejoin="round"/>
   <circle cx="${x(last)}" cy="${y(w[last])}" r="6" fill="#034774"/>
   ${w.map((v,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="11" fill="#7a8b9c" font-family="Inter,sans-serif">W${i+1}</text>`).join("")}
   <text x="${x(last)-10}" y="${y(w[last])-12}" text-anchor="end" font-size="12" font-weight="700" fill="#0b2a44" font-family="Inter,sans-serif">${w[last]} min</text></svg>`;
}

function track(s){return `<div class="track">${[1,2,3,4,5,6,7,8].map(w=>`<div class="${w<s.week?"done":w===s.week?(s.st==="red"?"stall":"now"):""}">Wk ${w}</div>`).join("")}</div>`;}

     :`<div class="card small"><b style="color:var(--ink)">Tutor match: not needed right now.</b> It opens only if progress stalls after week 8. Switch to Sam K. to see what that family gets.</div>`;
  } else if(S.pv==="skills"){

const spk='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#034774" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="#034774"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';

     `<div class="hero"><div class="ring"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="8"/><circle cx="43" cy="43" r="36" fill="none" stroke="#6faedd" stroke-width="8" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="${226*(1-S.mins/10)}" transform="rotate(-90 43 43)"/></svg><span>${S.mins}<small>of 10 min</small></span></div>

  } else if(S.ph==="check"){

      :qcard(label,pct,it.q,it.say)+opts(it.o,"qpick")+`<button class="next" id="qnext" data-act="qnext" disabled>${S.q===Q.length-1?"Finish":"Next"}</button>`);
  } else if(S.ph==="checkdone"){
    w.innerHTML=phd("Reading check","Nice work, Maya")+`<div class="q"><div class="qp">ALL 12 QUESTIONS DONE</div><div class="pb"><i style="width:100%"></i></div><div class="qt">Your practice plan is ready.</div><p style="margin-top:10px;color:var(--mut);font-size:15px">10 minutes a day, picked for the skills that will help you most.</p></div><button class="next" data-act="ph" data-t="today">Go to Today</button>`;
  } else if(S.ph==="practice"){
    const it=P[S.pr];
    w.innerHTML=phd("Today's practice","Spelling patterns")+qcard(`QUESTION ${S.pr+1} OF ${P.length}`,(S.pr+1)/P.length*100,it.q)+opts(it.o,"panswer")+`<p id="fb" style="margin-top:12px;min-height:22px;font-size:14.5px;font-weight:700"></p>`;
  } else if(S.ph==="read"){
    w.innerHTML=phd("Short read · 3 min","Esports practice")+`<div class="pcard" style="margin-top:12px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="lis" style="margin:0" data-act="aloud">${spk}Read aloud</button>${S.focus?'<button class="lis" style="margin:0" data-act="lprev">↑</button><button class="lis" style="margin:0" data-act="lnext">↓</button>':""}</div>
      <div class="passage ${S.spaced?"spaced":""} ${S.focus?"focus":""}">${LINES.map((t,i)=>`<span class="ln ${i===S.line?"on":""}" data-act="line" data-l="${i}">${t}</span>`).join(" ")}</div></div>
      <p style="font-size:12.5px;color:var(--mut);margin-top:10px">Turn on spacing and line focus in Tools.</p>`;
  } else if(S.ph==="progress"){
    w.innerHTML=phd("Week 6 of 8","Your progress")+
     `<div class="hero" style="display:block;padding:18px 20px"><div class="hk">NEXT STEP</div><div class="ht" style="font-size:20px">You're on track</div><div class="hs" style="font-size:12.5px;line-height:1.4">3 of 4 skills are improving. Keep your 10 minutes a day going.</div><button class="gobtn" data-act="ph" data-t="today">See my plan ${chev}</button></div>
     <div class="pcard" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">Weekly progress</b><span class="chg">▲ 18%</span></div>
      <svg width="100%" height="96" viewBox="0 0 300 96" preserveAspectRatio="none" style="margin-top:8px;display:block"><g stroke="#e7eef5"><line x1="0" y1="16" x2="300" y2="16"/><line x1="0" y1="48" x2="300" y2="48"/><line x1="0" y1="80" x2="300" y2="80"/></g><path d="M0 80 L50 74 L100 66 L150 61 L200 46 L250 38 L300 26 L300 96 L0 96Z" fill="rgba(58,134,196,.14)"/><path d="M0 80 L50 74 L100 66 L150 61 L200 46 L250 38 L300 26" fill="none" stroke="#3a86c4" stroke-width="3.5" stroke-linejoin="round"/><circle cx="295" cy="26" r="5" fill="#034774"/></svg></div>
     <div class="sect" style="margin-top:14px"><b>Skills</b></div>
     ${[["Decoding",58,"#3a86c4",24],["Spelling patterns",52,"#f0883e",11],["Reading fluency",72,"#3a86c4",14]].map(x=>`<div class="skill"><div style="flex:1"><div class="psn">${x[0]}</div><div class="pbar"><i style="width:${x[1]}%;background:${x[2]}"></i></div></div><div class="chg">+${x[3]}%</div></div>`).join("")}`;
  } else {
    w.innerHTML=phd("Works in every class","Reading tools")+
     [["aloud","Read aloud","Hear any text out loud",null],["space","Letter and line spacing","More room between letters and lines",S.spaced],["focus","Line focus","Highlights one line at a time",S.focus]].map(t=>`<div class="pcard" style="margin-top:10px"><div class="toolrow"><div><div class="psn" style="font-size:15px;font-weight:700">${t[1]}</div><div class="rm">${t[2]}</div></div>${t[3]===null?`<button class="lis" style="margin:0" data-act="aloud">${spk}Try</button>`:`<button class="sw" data-act="${t[0]}" aria-pressed="${t[3]}" aria-label="${t[1]}"></button>`}</div></div>`).join("")+
     `<button class="next" data-act="ph" data-t="read">Try them on a passage</button><p style="font-size:12.5px;color:var(--mut);margin-top:10px">Use them on science texts, history articles, or math word problems.</p>`;
  }
  const m=by("maya"), chk=S.ph==="check"||S.ph==="checkdone";
  $("#aside").innerHTML=chk
   ?`<div><div class="eyebrow">Step 1 · In class</div><h2>The 10–15 minute risk check</h2></div><p style="font-size:15px;color:var(--ink2)">Every student in the grade takes it, so nobody is singled out. Maya never sees a score or the word "dyslexia." Her teacher gets the skill profile.</p>
     <div class="row"><button class="btn" data-act="qskip">${S.ph==="checkdone"?"Open Maya's result as Ms. Lee →":"Skip to the end"}</button>${S.ph==="check"?"":'<button class="btn ghost" data-act="qrestart">Take it again</button>'}</div>`
   :`<div><div class="eyebrow">Maya's phone · Grade 8</div><h2>Ten private minutes a day</h2></div><p style="font-size:15px;color:var(--ink2)">It looks like any study app. The word "dyslexia" never appears on a student's screen.</p>
     <div class="card"><div class="ct">What Ms. Lee and Maya's parent see</div><div class="line ${S.flash?"flash":""}"><span>Practice this week</span><b>${wk(m)} min${S.practiced?" · updated just now":""}</b></div><div class="line"><span>Day streak</span><b>${S.streak} days</b></div><div class="line"><span>Skills improving</span><b>${improving(m)} of 4</b></div></div>

  S.flash=false;

function fit(){

/* ---------- modals ---------- */
function openModal(h){$("#modalBody").innerHTML=h;$("#modal").hidden=false;const b=$("#modalBody button");if(b)b.focus();}
function report(id){
  const s=by(id), tot=s.min.reduce((a,b)=>a+b,0);
  openModal(`<div class="eyebrow">Progress report · sample</div><h2>${s.name} · Grade 8 · Weeks 1–${s.week}</h2><p class="small" style="margin-top:6px">For the campus dyslexia coordinator. A record of screening and practice, not a diagnosis.</p>
  <table><tr><td>Risk check result (Oct 14)</td><td>Flagged</td></tr><tr><td>Total practice time</td><td>${Math.floor(tot/60)} h ${tot%60} min</td></tr>${Object.entries(s.sk).map(([k,v])=>`<tr><td>${SK[k][0]}</td><td>${v[0]}% → ${v[1]}%</td></tr>`).join("")}<tr><td>Outcome</td><td>${s.st==="red"?"No improvement after 8 weeks":s.label}</td></tr></table>
  <div class="rec" style="margin-top:14px;font-size:14px">Practice follows structured literacy and is reviewed by a Certified Academic Language Therapist. The report fits the evaluation process in the Texas Dyslexia Handbook.</div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="close">Close</button></div>`);
}
function letter(id){
  const s=by(id), f=first(s);
  openModal(`<div class="eyebrow">Evaluation request · draft</div><h2>Letter to the school</h2><div class="letter" id="letterText">Dear Campus Dyslexia Coordinator,\n\nI am writing to request a full individual evaluation for my child, ${s.name}, grade 8, for dyslexia and related reading difficulties.\n\n${f} completed a Dyslective reading risk check on October 14 and was flagged in decoding and spelling. Since then ${f} has completed ${s.week} weeks of daily practice. The attached progress report shows the scores at the start and now.\n\nPlease send me the consent form and let me know the next steps.\n\nThank you,\n[Parent name]</div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-act="copy">Copy text</button><button class="btn" data-act="close">Close</button></div>`);
}

/* ---------- presenter guide ---------- */
const STEPS=[
 ["The gap","A campus screened all 900 students. 72 were flagged, and none of them had asked for help.",()=>{S.tv="dashboard";go("teacher");}],
 ["The risk check","Maya takes the check on her own screen. Answer one question, then press “Skip to the end.”",()=>{S.ph="check";S.q=0;go("student");}],
 ["The skill profile","Ms. Lee gets Maya's result: flagged in 2 of 4 skills, with a practice plan.",()=>{S.checkDone=true;S.tv="check";S.tid="maya";go("teacher");}],
 ["Daily practice","Maya taps Continue and does her 10 minutes. The panel on the right updates.",()=>{S.ph="today";go("student");}],
 ["Six weeks later","The shared dashboard shows Maya's practice and her skill gains.",()=>{S.tv="student";S.tid="maya";go("teacher");}],
 ["When practice isn't enough","Sam stalled at week 8, so his parent gets a tutor match and a free evaluation request.",()=>{S.child="sam";S.pv="overview";go("parent");}]
];
function renderGuide(){
  $("#gSteps").innerHTML=STEPS.map((s,i)=>`<button data-act="gstep" data-i="${i}" aria-pressed="${i===S.step}" aria-label="Step ${i+1}: ${s[0]}">${i+1}</button>`).join("");
  $("#gSay").innerHTML=`<b>Step ${S.step+1} of ${STEPS.length} · ${STEPS[S.step][0]}</b>${STEPS[S.step][1]}`;
}
function gstep(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));STEPS[S.step][2]();renderGuide();}

/* ---------- actions ---------- */
const A={
 tv:d=>{S.tv=d.t;renderTeacher();window.scrollTo(0,0);},
 tstu:d=>{S.tv="student";S.tid=d.id;renderTeacher();window.scrollTo(0,0);},
 tcheck:d=>{S.tv="check";S.tid=d.id;renderTeacher();window.scrollTo(0,0);},
 pv:d=>{S.pv=d.t;renderParent();window.scrollTo(0,0);},
 child:d=>{S.child=d.id;renderParent();},
 say:d=>toast(d.msg), report:d=>report(d.id), letter:d=>letter(d.id), close:()=>$("#modal").hidden=true,
 copy:()=>{const el=$("#letterText"),sel=()=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r);toast("Text selected. Press Ctrl or Cmd + C");};
   try{navigator.clipboard.writeText(el.textContent).then(()=>toast("Copied"),sel);}catch(e){sel();}},
 hear:d=>say(d.t),
 ph:d=>{S.ph=d.t;renderPhone();},
 qrestart:()=>{S.ph="check";S.q=0;renderPhone();},
 qpick:(d,b)=>{$$("#pw .opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");$("#qnext").disabled=false;},
 qnext:()=>{S.q++;if(S.q>=Q.length){S.ph="checkdone";S.checkDone=true;}renderPhone();},
 qread:()=>{S.q++;renderPhone();},
 qskip:()=>{if(S.ph==="check"){S.ph="checkdone";S.checkDone=true;renderPhone();}else{S.tv="check";S.tid="maya";go("teacher");}},
 pstart:()=>{S.ph="practice";S.pr=0;renderPhone();},
 panswer:(d,b)=>{const it=P[S.pr],ok=+d.i===it.a;b.setAttribute("aria-pressed","true");$$("#pw .opt").forEach(x=>x.disabled=true);
   $("#fb").innerHTML=ok?'<span style="color:var(--grn)">Nice. That\'s right.</span>':`<span style="color:var(--red)">Not quite.</span> It's “${it.o[it.a]}”.`;
   setTimeout(()=>{if(S.ph!=="practice")return;S.pr++;if(S.pr>=P.length){S.ph="today";S.mins=10;if(!S.practiced){S.streak++;S.practiced=true;S.flash=true;}renderPhone();ptoast(`Practice done. ${S.streak}-day streak`);}else renderPhone();},850);},
 aloud:()=>say(S.focus?LINES[S.line]:PASSAGE), space:()=>{S.spaced=!S.spaced;renderPhone();}, focus:()=>{S.focus=!S.focus;renderPhone();},
 line:d=>{if(S.focus){S.line=+d.l;renderPhone();}}, lprev:()=>{S.line=Math.max(0,S.line-1);renderPhone();}, lnext:()=>{S.line=Math.min(LINES.length-1,S.line+1);renderPhone();},
 gstep:d=>gstep(+d.i), gnext:()=>gstep(S.step+1), gprev:()=>gstep(S.step-1),
 ghide:()=>{$("#guide").hidden=true;$("#gopen").hidden=false;},
 gshow:()=>{$("#guide").hidden=false;$("#gopen").hidden=true;}
};
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){$("#modal").hidden=true;return;}
  const b=e.target.closest("[data-act]"); if(b&&!b.disabled&&A[b.dataset.act])A[b.dataset.act](b.dataset,b);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("#modal").hidden=true;
  if(!$("#modal").hidden)return;
  if(e.key==="ArrowRight"){e.preventDefault();gstep(S.step+1);} if(e.key==="ArrowLeft"){e.preventDefault();gstep(S.step-1);}
});
renderGuide(); show();
})();
</script>
